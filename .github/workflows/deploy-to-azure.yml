name: Deploy Spring Boot to Azure Functions

# Gatilho: Rodar sempre que houver um push na branch 'master'
on:
  push:
    branches:
      - dev  # (Nota: Muitos repos novos usam 'main' em vez de 'master')

# Variáveis de ambiente
env:
  AZURE_FUNCTIONAPP_NAME: 'labsync-api' # O nome único que você criou (ex: meu-app-faculdade-2025)
  JAVA_VERSION: '21' # Deve ser o mesmo do seu pom.xml

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # Rodar em uma máquina virtual Linux

    steps:
      # 1. Baixa o seu código do repositório
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v3

      # 2. Configura o Java (JDK)
      - name: 'Set up Java'
        uses: actions/setup-java@v3
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'microsoft' # Usar o JDK da Microsoft

      # 3. Faz o build do projeto com Maven
      - name: 'Build with Maven'
        run: mvn clean package -DskipTests

      # 4. Faz o login na Azure usando o Secret
      - name: 'Login to Azure'
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 5. Faz o deploy no Azure Functions
      - name: 'Deploy to Azure Functions'
        uses: azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: '${{ github.workspace }}/target/azure-functions/${{ env.AZURE_FUNCTIONAPP_NAME }}'
          
      # 6. (Opcional) Logout da Azure
      - name: 'Logout from Azure'
        run: az logout
        if: always() # Garante que o logout ocorra mesmo se o passo 5 falhar